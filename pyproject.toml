[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-happiness"
version = "0.1.0"
description = "Local positive activation steering with bounded calibration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.6,<3", "transformers>=4.51,<6", "safetensors>=0.4"]

[project.scripts]
ai-happiness = "ai_happiness.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_happiness*"]
